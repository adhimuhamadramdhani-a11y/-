<!DOCTYPE html>
<html>
<head>
    <title>Latihan Multimedia</title>
</head>

<body style="text-align:center; font-family: Arial;">

    <h2>Latihan Multimedia: Gambar, Video, dan Audio</h2>

    <!-- Gambar -->
    <img src="foto1.png" width="300" alt="foto1">
    <p>Gambar: foto1.png</p>

    <hr>

    <!-- Video Player -->
    <h3>Video Player</h3>

    <button onclick="tekanPause()">Play/Pause</button>
    <button onclick="menjadiBig()">Big</button>
    <button onclick="menjadiSmall()">Small</button>
    <button onclick="menjadiNormal()">Normal</button>

    <br><br>

    <video id="videoku" width="430">
        <source src="video1.mp4" type="video/mp4">
        Browser anda tidak support video HTML5.
    </video>

    <hr>

    <!-- Audio Player -->
    <h3>Audio Player</h3>

    <audio controls>
        <source src="audio1.mp3" type="audio/mpeg">
        Browser anda tidak support audio HTML5.
    </audio>

<script>

var VideoAku = document.getElementById("videoku");

function tekanPause() {
    if (VideoAku.paused)
        VideoAku.play();
    else
        VideoAku.pause();
}

function menjadiBig() {
    VideoAku.width = 560;
}

function menjadiSmall() {
    VideoAku.width = 320;
}

function menjadiNormal() {
    VideoAku.width = 430;
}

</script>

</body>
</html>
